[project]
name = "my_cool_crew"
version = "0.1.0"
description = "my_cool_crew using crewAI"
authors = [{ name = "Nurtugan", email = "nurtugang17@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.9.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.55.0",
]

[project.scripts]
my_cool_crew = "my_cool_crew.main:run"
run_crew = "my_cool_crew.main:run"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
